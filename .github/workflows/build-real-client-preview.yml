name: Build real client preview

on:
  push:
    branches:
      - feat/tiger-camera-port
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: real-client-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on:
      - self-hosted
      - infinitecanvas
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: |
          bun install || {
            echo "First bun install failed; clearing Bun package cache and retrying once..."
            rm -rf ~/.bun/install/cache
            bun install
          }

      - name: Build web client
        run: bun run build

      - name: Package real client to NAS
        shell: bash
        run: |
          mkdir -p /runner/builds
          rm -f /runner/builds/infiniteCanvas-real-client.zip
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          dist = Path('dist')
          if not dist.is_dir():
              raise SystemExit('dist directory was not created')

          target = Path('/runner/builds/infiniteCanvas-real-client')
          shutil.make_archive(str(target), 'zip', root_dir=dist)
          print(f'Package created: {target}.zip')
          PY
          ls -lh /runner/builds/infiniteCanvas-real-client.zip

      - name: Remove previous downloadable test artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          name = "infiniteCanvas-chat-test"

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts?name={name}&per_page=100",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          for artifact in payload.get("artifacts", []):
              delete_request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}",
                  method="DELETE",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(delete_request, timeout=30):
                  pass
              print(f"Deleted old artifact: {artifact['id']}")
          PY

      - name: Upload latest downloadable test package
        uses: actions/upload-artifact@v4
        with:
          name: infiniteCanvas-chat-test
          path: /runner/builds/infiniteCanvas-real-client.zip
          if-no-files-found: error
          retention-days: 1

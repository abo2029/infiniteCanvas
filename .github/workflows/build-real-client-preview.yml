name: Build real client preview
# trigger build

on:
  push:
    branches:
      - feat/tiger-camera-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-client-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on:
      - self-hosted
      - infinitecanvas
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          bun install || {
            echo "First bun install failed; clearing Bun package cache and retrying once..."
            rm -rf ~/.bun/install/cache
            bun install
          }

      - name: Build web client
        run: bun run build

      - name: Package real client
        run: |
          mkdir -p /runner/builds
          rm -f /runner/builds/infiniteCanvas-real-client.zip
          cd dist
          zip -r /runner/builds/infiniteCanvas-real-client.zip .
          echo "Package created: /runner/builds/infiniteCanvas-real-client.zip"

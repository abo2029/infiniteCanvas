name: Build real client preview

on:
  push:
    branches:
      - feat/tiger-camera-port

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web client
        run: npm run build

      - name: Add local preview launcher
        shell: bash
        run: |
          cat > dist/START_PREVIEW_WINDOWS.bat <<'BAT'
          @echo off
          cd /d %~dp0
          where py >nul 2>nul
          if %errorlevel%==0 (
            start "" http://127.0.0.1:4173/canvas
            py -m http.server 4173 --bind 127.0.0.1
            exit /b
          )
          where python >nul 2>nul
          if %errorlevel%==0 (
            start "" http://127.0.0.1:4173/canvas
            python -m http.server 4173 --bind 127.0.0.1
            exit /b
          )
          echo Python was not found. Please run this folder with any static HTTP server.
          pause
          BAT

      - name: Upload real client
        uses: actions/upload-artifact@v4
        with:
          name: infiniteCanvas-real-client
          path: web/dist
          if-no-files-found: error
          retention-days: 7

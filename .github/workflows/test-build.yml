name: Test Build Alpha

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on:
      - self-hosted
      - infinitecanvas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Read alpha version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Install dependencies
        working-directory: web
        run: bun install

      - name: Build web client
        working-directory: web
        run: bun run build

      - name: Package alpha test build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          test -f START_PREVIEW_MAC.command
          test -f START_PREVIEW_WINDOWS.bat
          test -f _preview_server.py
          test -f README_TEST.md
          test -f web/dist/index.html

          rm -rf package
          mkdir -p package
          cp -r web/dist package/dist
          cp START_PREVIEW_MAC.command package/
          cp START_PREVIEW_WINDOWS.bat package/
          cp _preview_server.py package/
          cp README_TEST.md package/
          cp CHANGELOG.md package/
          chmod +x package/START_PREVIEW_MAC.command

          cat > package/BUILD_INFO.json <<EOF
          {
            "version": "${VERSION}",
            "channel": "alpha",
            "platform": ["macOS", "Windows11"],
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}"
          }
          EOF

      - name: Delete previous alpha artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async () => {
            const repo = process.env.GITHUB_REPOSITORY;
            const token = process.env.GH_TOKEN;
            const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };
            const list = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts?per_page=100`, { headers });
            const data = await list.json();
            for (const artifact of data.artifacts || []) {
              if (/^infiniteCanvas-v.*-alpha-test$/.test(artifact.name)) {
                await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${artifact.id}`, { method: 'DELETE', headers });
              }
            }
          })();
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: infiniteCanvas-${{ steps.version.outputs.version }}-test
          path: package
          if-no-files-found: error
          retention-days: 7
